     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="dashboard-container">
        <aside class="side-bar">
            <div class="logo-container">
        <span class="dashboard-logo">CV</span>
        <span class="logo-heading">CryptoVault</span>
            </div>
            <nav class="nav-side-bar">
                <div class="main-menu">MAIN MENU</div>
                <div class="icon active">
                    <div> 
                    <img src="crypto-vault-img/grid (2).svg" alt="grid-icon" class="grid-icon active"> 
                    </div>
                      <a href="dashboard.html" class="nav-item active"> Dashboard</a>
                </div>
              
                <a href="" class="nav-item" >Market</a>
                <div class="icon">
                     <img src="crypto-vault-img/wallet.svg" alt="grid-icon" class="grid-icon">
                     <a href="" class="nav-item" >Wallet</a>
                </div>
                
            </nav>

            <nav class="nav-side-bar">
                <div class="account">ACCOUNT</div>
                <a href="#" class="nav-item">Setting</a>
            </nav>

            <div class="nav-footer">
                <div class="footer-section">Light Mode</div>
                <a href="index.html" class="footer-logout">Log Out</a>
            </div>
        </aside>

        <!-- RIGHT SIDE -->
         <div>
            <div class="dashboard-header">
                <div>
                <h4 class="dashboard-heading">Dashboard</h4>
            <p class="dashboard-paragraph">Welcome back! here is your portfolio review</p>
                </div>
            

                <div class="sub-dashboard-container">

                <input type="search" name="q" placeholder="search..." class="search">
                <img src="crypto-vault-img/search.svg" alt="search-icon" class="search-icon">
                    </form>
           

             <div class="notification">
                <img src="crypto-vault-img/bell.svg" alt="notification-bell" class="notification-bell">
            </div>

             <div class="dashboard-button">
                <div class="dashboard-header-logo">AM</div>
            <div>
            <p class="dashboard-p">Alex Morgan</p>
            <p class="pro-trader">Pro Trader</p>
            </div>
            </div>
              </div>
            </div>
         </div>


         <!-- Right Column -->
                 <div class=" content-wrapper">

                   <div class="chart-container">
                    <div class="sub-chart-container">

                    </div>
                    <div></div>
                    <div></div>
                    <div></div>

                   </div>
